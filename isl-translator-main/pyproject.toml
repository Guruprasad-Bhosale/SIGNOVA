[project]
name = "isl-translator"
version = "0.1.0"
description = "State-of-the-art continuous Indian Sign Language (ISL) recognition and translation system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Siddhant" }
]
keywords = ["sign-language", "ISL", "deep-learning", "transformer", "mediapipe", "translation"]

dependencies = [
    # Core Deep Learning
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    
    # Pose Extraction
    "mediapipe>=0.10.9",
    
    # Computer Vision
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    
    # Data Processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    
    # NLP & Translation
    "transformers>=4.36.0",
    "sentencepiece>=0.1.99",
    "sacremoses>=0.0.53",
    "protobuf>=3.20.0",
    
    # Training Utilities
    "tqdm>=4.66.0",
    "tensorboard>=2.15.0",
    
    # Configuration
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    
    # Evaluation Metrics
    "jiwer>=3.0.0",
    "sacrebleu>=2.4.0",
    "editdistance>=0.6.2",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    
    # Kaggle dataset download
    "kaggle>=1.5.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
colab = [
    "gpustat>=1.1.1",
    "wandb>=0.16.0",
]
geometric = [
    # Install separately - requires torch first
    # "torch-geometric>=2.4.0",
]

[project.scripts]
isl-train = "scripts.train:main"
isl-demo = "src.inference.demo:main"
isl-extract = "scripts.extract_keypoints:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
