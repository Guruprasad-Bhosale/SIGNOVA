[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signova"
version = "0.1.0"
description = "Continuous Indian Sign Language (ISL) to English Translation System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SIGNOVA Research Team" }
]
keywords = [
    "sign-language",
    "indian-sign-language",
    "isl",
    "computer-vision",
    "mediapipe",
    "st-gcn",
    "transformer",
    "ctc",
    "translation"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    # Core Data Processing
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",

    # Computer Vision & Perception
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.9",
    "pillow>=10.1.0",

    # Machine Learning Core (CPU/CUDA compatible)
    "scikit-learn>=1.3.0",

    # API & Backend
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",

    # Utilities & Progress
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
# Deep Learning with PyTorch (Install with proper CUDA wheel per docs/development.md)
torch = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
]
# Evaluation metrics for translation & recognition
evaluation = [
    "jiwer>=3.0.3",
    "sacrebleu>=2.4.0",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
]
# Visualization & Notebook tools
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]
# Development & Testing
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
]

[project.scripts]
signova-env = "scripts.check_environment:main"
signova-audit = "scripts.inspect_dataset:main"
signova-manifest = "scripts.create_manifest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/signova"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
